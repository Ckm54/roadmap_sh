name: task-tracker release

# Push a semver tag (e.g. v1.0.0) to publish binaries to GitHub Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: task_tracker/go.mod
          cache-dependency-path: task_tracker/go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: task_tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
